<button 
  class="back-to-top-btn" 
  [class.show]="showButton"
  [class.bounce]="isBouncing"
  (click)="scrollToTop()">
  
  <svg class="progress-ring" width="40" height="40" viewBox="0 0 40 40">
    <circle 
      class="progress-ring__background" 
      cx="20" cy="20" r="18" 
      fill="transparent" 
      stroke="rgba(0, 0, 0, 0.1)" 
      stroke-width="3">
    </circle>
    
    <circle 
      class="progress-ring__circle" 
      cx="20" cy="20" r="18" 
      fill="transparent" 
      stroke="var(--color-1)" 
      stroke-width="3" 
      stroke-linecap="round"
      [style.strokeDasharray]="circumference"
      [style.strokeDashoffset]="dashoffset">
    </circle>
  </svg>
  
  <span class="arrow">
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="var(--color-2)" width="32" height="32">
      <g id="up_arrow" data-name="up arrow">
        <path d="m21.71 14.29-5-5a1 1 0 0 0 -.3-.19h-.1a1 1 0 0 0 -.25-.1h-.06a.85.85 0 0 0 -.31.06.85.85 0 0 0 -.3.19l-5 5a1 1 0 0 0 0 1.42 1 1 0 0 0 1.42 0l3.19-3.26v9.59a1 1 0 0 0 2 0v-9.59l3.29 3.3a1 1 0 0 0 1.42-1.42z" />
      </g>
    </svg>
  </span>
</button>

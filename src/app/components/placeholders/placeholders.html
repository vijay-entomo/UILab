<card-gallery
  [componentDetails]="selectedComponent"
  [showImage]="false"
  [showName]="true"
  [showDescription]="true"
  [showLink]="false"
  customClass="component_page"
>
</card-gallery>
<hr class="my-5" />
<div class="whentouse">
  <div class="h2">Usage Rules</div>
  <ul class="markdown">
    <li>Match the exact dimensions of the incoming content.</li>
    <li>Animate with a subtle, mechanical pulse.</li>
    <li>Swap instantly when data loads.</li>
    <li>Never show placeholders for longer than 3 seconds without a failure fallback.</li>
  </ul>
</div>
<hr class="my-5" />

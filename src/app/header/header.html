  <div class="">
    <button routerLink="/" class="logo">
      <div class="logo-mark">UI.</div>
      <span class="logo-text">LAB</span>
    </button>
  </div>

  <div class="actions d-flex align-items-center gap-3">
    <div class="d-flex align-items-center gap-2" style="display: none !important">
      <!-- <label for="primaryColorPicker" class="small text-muted mb-0">Primary Color:</label> -->
      <input
        type="color"
        id="primaryColorPicker"
        class="form-control form-control-color"
        title="Choose primary color"
        [value]="currentPrimaryColor"
        (input)="updatePrimaryColor($event)"
      />
    </div>

    <div class="theme-toggle-wrapper">
      <input
        type="checkbox"
        id="theme-toggle"
        class="theme-toggle-checkbox"
        [checked]="themeService.getCurrentTheme() === 'dark'"
        (change)="onToggleChange($event)"
      />

      <label for="theme-toggle" class="theme-toggle-label">
